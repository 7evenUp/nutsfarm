
server {

  listen 3000;

    access_log /dev/stdout;
    error_log /dev/stdout warn;

    server_name_in_redirect off;
    proxy_buffering off;

    index index.html;

    root /usr/share/nginx/html/;

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

}
