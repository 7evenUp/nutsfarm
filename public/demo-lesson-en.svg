<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1000" viewBox="0 0 700 1000"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#342055"/><stop offset="1" stop-color="#050D12"/></linearGradient></defs><rect width="700" height="1000" fill="url(#bg)"/><circle cx="350" cy="230" r="105" fill="#F5CD32"/><text x="350" y="265" text-anchor="middle" font-family="Arial" font-size="90" font-weight="bold" fill="#342055">N</text><g fill="white" font-family="Arial" text-anchor="middle"><text x="350" y="435" font-size="38" font-weight="bold">Wallets and keys</text><text x="350" y="500" font-size="24">Crypto is recorded on a blockchain.</text><text x="350" y="545" font-size="24">Your wallet gives access to your assets.</text><text x="350" y="635" font-size="24" fill="#F5CD32">The recovery phrase is your wallet key.</text><text x="350" y="680" font-size="24">Keep it in a safe place.</text><text x="350" y="725" font-size="24">Never share it with anyone.</text><text x="350" y="880" font-size="20" fill="#B5A8CF">Nuts Farm · Interactive demo lesson</text></g></svg>